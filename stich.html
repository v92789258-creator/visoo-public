<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Stitch Inventa</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f7f7f4;
      color: #0c1324;
      padding: 40px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      padding: 14px 22px;
      background: #0c1324;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    pre {
      margin-top: 24px;
      padding: 18px;
      background: #111827;
      color: #e5e7eb;
      white-space: pre-wrap;
      overflow: auto;
    }
  </style>
</head>
<body>

  <h1>Probar generación con Stitch</h1>

  <textarea id="prompt">Crea una sección hero editorial para VISO, software para ópticas. Estilo premium, fondo blanco roto, azul profundo, botones WhatsApp y demo.</textarea>

  <button onclick="generate()">Generar</button>

  <pre id="output">Esperando...</pre>

  <script>
    const API_KEY = "TU_API_KEY";

    async function generate() {
      const output = document.getElementById("output");
      const prompt = document.getElementById("prompt").value;

      output.textContent = "Generando...";

      try {
        const response = await fetch("https://stitch.googleapis.com/mcp", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json",
            "X-Goog-Api-Key": API_KEY
          },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
            method: "tools/call",
            params: {
              name: "create_project",
              arguments: {
                title: "Prueba Inventa"
              }
            }
          })
        });

        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);

      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
